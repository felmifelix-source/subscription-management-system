{% extends "base.html" %}{% block content %}
<div class="page-head"><div><p class="eyebrow">CATALOGUE</p><h1>Products</h1><p class="muted">Create and manage products and add-ons.</p></div></div>
<div class="two-col"><section class="panel"><h2>Add a product</h2><form method="post" class="form">
<label>Product name<input name="name" required></label><label>Type<select name="product_type"><option>Software</option><option>Add-on</option><option>Service</option><option>Physical</option></select></label>
<div class="form-row"><label>Sales price (₹)<input type="number" step="0.01" min="0" name="sales_price" required></label><label>Cost price (₹)<input type="number" step="0.01" min="0" name="cost_price" value="0"></label></div>
<label>Notes<textarea name="notes" rows="3"></textarea></label><button class="btn primary">Save product</button></form></section>
<section class="panel"><h2>Product catalogue</h2>{% for p in rows %}<div class="list-row"><div><b>{{ p.name }}</b><small>{{ p.product_type }} · {{ p.notes }}</small></div><strong>{{ money(p.sales_price) }}</strong></div>{% else %}<div class="empty">No products yet.</div>{% endfor %}</section></div>
{% endblock %}
